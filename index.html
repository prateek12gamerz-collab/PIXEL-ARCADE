
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL ARCADE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080b1b;color:white;min-height:100vh}
header{padding:22px 15px;text-align:center;background:linear-gradient(120deg,#17104a,#25105d,#101b48);border-bottom:1px solid #603bba}
header h1{font-size:30px;letter-spacing:3px;color:#c9a7ff;text-shadow:0 0 18px #8c45ff}
header p{color:#c5b9e9;margin-top:8px}
button{border:0;border-radius:12px;padding:12px 18px;background:#854cff;color:white;font-weight:bold;font-size:15px;cursor:pointer;margin:5px}
button:active{transform:scale(.96)}
button:hover{filter:brightness(1.2)}
.secondary{background:#252b4b}
.sound{position:absolute;right:12px;top:12px;background:#29264c}
main{max-width:1000px;margin:auto;padding:20px}
.screen{display:none}
.screen.active{display:block}
.heading{text-align:center;margin:12px 0 22px}
.heading h2{font-size:25px;color:#d7c1ff}
.heading p{color:#aaa;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px}
.game-card{background:linear-gradient(145deg,#171d3d,#241344);border:1px solid #39305f;border-radius:17px;padding:18px 10px;text-align:center;cursor:pointer;transition:.2s;min-height:135px}
.game-card:hover{transform:translateY(-5px);border-color:#a36aff;box-shadow:0 0 18px #6736a855}
.game-card .emoji{font-size:38px;display:block;margin-bottom:10px}
.game-card h3{font-size:15px}
.game-card small{display:block;color:#a99bc8;margin-top:8px}
.panel{background:#141a35;border:1px solid #37315e;border-radius:18px;padding:20px;text-align:center;margin:15px auto;max-width:600px}
.options{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:15px 0}
#gameArea{margin:18px auto;text-align:center}
.status{color:#d5c5ff;font-size:18px;margin:14px}
.board{display:grid;gap:6px;justify-content:center;margin:18px auto}
.cell{width:75px;height:75px;border-radius:12px;background:#252b4b;color:white;font-size:32px;border:1px solid #51477c;display:grid;place-items:center;cursor:pointer}
.cell:hover{background:#39315f}
.ttt{grid-template-columns:repeat(3,75px)}
.big{font-size:24px;color:#cbaaff}
.memory{grid-template-columns:repeat(4,65px)}
.memory .cell{width:65px;height:65px;font-size:25px}
.board7{grid-template-columns:repeat(7,42px)}
.board7 .cell{width:42px;height:42px;border-radius:50%;font-size:23px}
.meter{height:24px;background:#292d4b;border-radius:20px;overflow:hidden;margin:20px auto;max-width:400px}
.meter span{display:block;height:100%;width:50%;background:linear-gradient(90deg,#5ce1ff,#b14dff);transition:.1s}
.bigbutton{font-size:25px;padding:22px 35px}
footer{text-align:center;color:#777;padding:25px;font-size:12px}
#intro{position:fixed;inset:0;background:#080719;z-index:10;display:grid;place-items:center;text-align:center;animation:fadeout 1s ease 2.2s forwards}
#intro h1{font-size:42px;color:#c9a2ff;letter-spacing:4px;animation:pop 1s infinite alternate}
#intro p{margin-top:15px;color:#b7a6df}
@keyframes pop{from{transform:scale(.94);text-shadow:0 0 8px #804bff}to{transform:scale(1.06);text-shadow:0 0 30px #a34dff}}
@keyframes fadeout{to{opacity:0;visibility:hidden}}
.hidden{display:none!important}
@media(max-width:450px){header h1{font-size:24px}.cell{width:65px;height:65px}.ttt{grid-template-columns:repeat(3,65px)}.memory{grid-template-columns:repeat(4,58px)}.memory .cell{width:58px;height:58px}.board7{grid-template-columns:repeat(7,37px)}.board7 .cell{width:37px;height:37px}}
</style>
</head>
<body>

<div id="intro"><div><h1>PIXEL ARCADE</h1><p>GET READY TO PLAY!</p></div></div>

<header>
<button class="sound" onclick="toggleSound()" id="soundBtn">🔊 Sound ON</button>
<h1>🎮 PIXEL ARCADE</h1>
<p>12 Games • 2 Players • Endless Fun</p>
</header>

<main>
<section id="home" class="screen active">
<div class="heading"><h2>CHOOSE YOUR GAME</h2><p>Select a game and challenge your skills!</p></div>
<div class="grid" id="gameGrid"></div>
</section>

<section id="modeScreen" class="screen">
<div class="panel">
<h2 id="selectedTitle">Choose Mode</h2>
<p class="status">How do you want to play?</p>
<div class="options">
<button onclick="chooseMode('friend')">👥 2 Players</button>
<button onclick="chooseMode('bot')">🤖 Play vs Bot</button>
</div>
<button class="secondary" onclick="goHome()">← Back</button>
</div>
</section>

<section id="difficultyScreen" class="screen">
<div class="panel">
<h2>SELECT DIFFICULTY</h2>
<div class="options">
<button onclick="startGame('Easy')">🟢 Easy</button>
<button onclick="startGame('Medium')">🟡 Medium</button>
<button onclick="startGame('Hard')">🔴 Hard</button>
</div>
<button class="secondary" onclick="show('modeScreen')">← Back</button>
</div>
</section>

<section id="playScreen" class="screen">
<div class="heading"><h2 id="gameTitle">GAME</h2><p id="gameSubtitle">Let's play!</p></div>
<div id="gameArea"></div>
<div style="text-align:center">
<button class="secondary" onclick="restartGame()">↻ Restart</button>
<button class="secondary" onclick="goHome()">🏠 Home</button>
</div>
</section>
</main>
<footer>© 2026 PIXEL ARCADE • Made for fun ❤️</footer>

<script>
const games=[
["Chess","♟️"],["Air Hockey","🏒"],["Mini Racing","🏎️"],["Sumo Tap Battle","💪"],
["Tic Tac Toe","❌"],["Connect Four","🔴"],["Checkers","⚫"],["Reaction Duel","⚡"],
["Tug of War","🪢"],["Maze Race","🌀"],["Memory Match","🧠"],["Tower Builder","🏗️"]
];
let current="",mode="friend",difficulty="Easy",sound=true,audioCtx=null,turn=0,board=[],score=[0,0],locked=false,interval=null,round=1;
const $=id=>document.getElementById(id);

function buildGames(){
$("gameGrid").innerHTML=games.map(g=>`
<div class="game-card" onclick="selectGame('${g[0]}')">
<span class="emoji">${g[1]}</span><h3>${g[0]}</h3><small>▶ PLAY NOW</small>
</div>`).join("");
}
buildGames();

function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
$(id).classList.add("active");
}
function selectGame(name){
current=name;
$("selectedTitle").textContent=name;
show("modeScreen");
beep(500);
}
function chooseMode(m){
mode=m;
if(["Tic Tac Toe","Connect Four","Memory Match","Reaction Duel","Chess","Checkers"].includes(current)){
show("difficultyScreen");
}else startGame("Medium");
}
function goHome(){
clearInterval(interval);
show("home");
}
function restartGame(){startGame(difficulty)}
function startGame(d){
difficulty=d;turn=0;score=[0,0];round=1;locked=false;
clearInterval(interval);
$("gameTitle").textContent=current;
$("gameSubtitle").textContent=(mode==="bot"?"Playing vs Bot":"2 Player Mode")+" • "+difficulty;
show("playScreen");
const area=$("gameArea");area.innerHTML="";
switch(current){
case "Tic Tac Toe":ticTacToe();break;
case "Reaction Duel":reaction();break;
case "Connect Four":connectFour();break;
case "Memory Match":memory();break;
case "Sumo Tap Battle":case "Tug of War":tapBattle();break;
case "Tower Builder":tower();break;
case "Maze Race":maze();break;
case "Mini Racing":racing();break;
case "Air Hockey":hockey();break;
case "Chess":chess();break;
case "Checkers":checkers();break;
}
beep(650);
}
function status(t){let e=document.querySelector(".status");if(e)e.textContent=t}
function beep(freq=440){
if(!sound)return;
try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
let o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.frequency.value=freq;g.gain.value=.04;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.09);
}catch(e){}
}
function toggleSound(){sound=!sound;$("soundBtn").textContent=sound?"🔊 Sound ON":"🔇 Sound OFF";}

// TIC TAC TOE
function ticTacToe(){
board=Array(9).fill("");
$("gameArea").innerHTML='<div class="status" id="tttStatus">Player X turn</div><div class="board ttt" id="tttBoard"></div>';
drawTTT();
}
function drawTTT(){
$("tttBoard").innerHTML=board.map((v,i)=>`<div class="cell" onclick="tttMove(${i})">${v}</div>`).join("");
}
function tttMove(i){
if(board[i]||locked)return;
board[i]=turn%2===0?"X":"O";turn++;beep();
drawTTT();
let win=winner(board);
if(win){$("tttStatus").textContent=win+" wins! 🎉";locked=true;return}
if(board.every(Boolean)){$("tttStatus").textContent="It's a draw!";locked=true;return}
$("tttStatus").textContent=(turn%2===0?"Player X":"Player O")+" turn";
if(mode==="bot"&&turn%2===1){
locked=true;
setTimeout(()=>{
let move=bestMove(board);
if(move!==-1){board[move]="O";turn++;drawTTT()}
let w=winner(board);
if(w){$("tttStatus").textContent="Bot wins! 🤖";locked=true}
else if(board.every(Boolean)){$("tttStatus").textContent="Draw!";locked=true}
else {$("tttStatus").textContent="Your turn";locked=false}
},450);
}
}
function winner(b){
for(let a of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]){
if(b[a[0]]&&b[a[0]]===b[a[1]]&&b[a[1]]===b[a[2]])return b[a[0]];
}return "";
}
function bestMove(b){
let empty=b.map((v,i)=>v?null:i).filter(v=>v!==null);
if(!empty.length)return -1;
if(difficulty==="Easy")return empty[Math.floor(Math.random()*empty.length)];
for(let p of ["O","X"]){
for(let i of empty){let c=[...b];c[i]=p;if(winner(c))return i}
}
if(b[4]==="")return 4;
return empty[Math.floor(Math.random()*empty.length)];
}

// REACTION DUEL
function reaction(){
$("gameArea").innerHTML=`<div class="status" id="reactStatus">Wait for GREEN... Round 1</div>
<button class="bigbutton" id="reactBtn" disabled onclick="reactClick()">WAIT...</button>
<div class="status" id="reactScore">Player 1: 0 | Player 2: 0</div>`;
nextReaction();
}
function nextReaction(){
locked=true;
$("reactBtn").disabled=true;$("reactBtn").style.background="#555";
$("reactBtn").textContent="WAIT...";
$("reactStatus").textContent="Wait for green signal...";
let delay=1200+Math.random()*2500;
interval=setTimeout(()=>{
locked=false;$("reactBtn").disabled=false;$("reactBtn").textContent="TAP NOW!";
$("reactBtn").style.background="#16a45b";
$("reactStatus").textContent="GO! ⚡";
beep(900);
},delay);
}
function reactClick(){
if(locked)return;
locked=true;
let player=mode==="bot"?1:(turn%2+1);
score[player-1]++;
$("reactScore").textContent=`Player 1: ${score[0]} | Player 2: ${score[1]}`;
$("reactStatus").textContent=`Player ${player} wins round ${round}!`;
$("reactBtn").textContent="NEXT ROUND";
$("reactBtn").style.background="#854cff";
$("reactBtn").onclick=()=>{
round++;turn++;$("reactBtn").onclick=reactClick;nextReaction();
};
}

// CONNECT FOUR
function connectFour(){
board=Array(42).fill("");
$("gameArea").innerHTML='<div class="status" id="cStatus">Red turn 🔴</div><div class="board board7" id="cBoard"></div>';
drawConnect();
}
function drawConnect(){
$("cBoard").innerHTML=Array.from({length:42},(_,i)=>`<div class="cell" onclick="dropDisc(${i%7})">${board[i]==="R"?"🔴":board[i]==="Y"?"🟡":" "}</div>`).join("");
}
function dropDisc(col){
if(locked)return;
let row=-1;
for(let r=5;r>=0;r--){if(!board[r*7+col]){row=r;break}}
if(row<0)return;
let p=turn%2===0?"R":"Y";board[row*7+col]=p;turn++;drawConnect();beep();
if(connectWin(p)){ $("cStatus").textContent=(p==="R"?"Red":"Yellow")+" wins!";locked=true;return}
if(board.every(Boolean)){ $("cStatus").textContent="Draw!";locked=true;return}
$("cStatus").textContent=(turn%2===0?"Red":"Yellow")+" turn";
if(mode==="bot"&&turn%2===1){
locked=true;setTimeout(()=>{
let c=Math.floor(Math.random()*7);locked=false;dropDisc(c);
},450);
}
}
function connectWin(p){
for(let r=0;r<6;r++)for(let c=0;c<7;c++){
for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
let ok=true;for(let k=0;k<4;k++){let rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=6||cc<0||cc>=7||board[rr*7+cc]!==p)ok=false}
if(ok)return true;
}}return false;
}

// MEMORY MATCH
function memory(){
let icons=["🍕","🚀","🎮","🐱","⚽","🍩","🎧","⭐"];
let deck=[...icons,...icons].sort(()=>Math.random()-.5),open=[],matched=[];
$("gameArea").innerHTML='<div class="status" id="memStatus">Find all matching pairs!</div><div class="board memory" id="memBoard"></div>';
$("memBoard").innerHTML=deck.map((v,i)=>`<div class="cell" id="mem${i}" onclick="flipCard(${i},'${v}')">?</div>`).join("");
window.memDeck=deck;window.memOpen=open;window.memMatched=matched;
}
function flipCard(i,v){
if(window.memMatched.includes(i)||window.memOpen.includes(i)||window.memOpen.length===2)return;
$("mem"+i).textContent=v;window.memOpen.push(i);beep();
if(window.memOpen.length===2){
let [a,b]=window.memOpen;
if(window.memDeck[a]===window.memDeck[b]){
window.memMatched.push(a,b);window.memOpen=[];
$("memStatus").textContent="Match found! 🎉";
if(window.memMatched.length===16)$("memStatus").textContent="YOU WON! 🏆";
}else setTimeout(()=>{ $("mem"+a).textContent="?";$("mem"+b).textContent="?";window.memOpen=[];},750);
}
}

// SUMO / TUG
function tapBattle(){
let title=current==="Sumo Tap Battle"?"Tap to push your opponent!":"Tap to pull the rope!";
$("gameArea").innerHTML=`<div class="status" id="tapStatus">${title}</div>
<div class="meter"><span id="meterBar"></span></div>
<div class="big" id="tapScore">0 : 0</div>
<button class="bigbutton" onclick="tapPoint(0)">🔵 PLAYER 1 TAP</button>
${mode==="friend"?'<button class="bigbutton" onclick="tapPoint(1)">🔴 PLAYER 2 TAP</button>':'<p class="status">Bot is playing too!</p>'}`;
window.tapValue=50;
if(mode==="bot")interval=setInterval(()=>{if(!locked)tapPoint(1)},difficulty==="Easy"?900:difficulty==="Medium"?600:350);
}
function tapPoint(p){
if(locked)return;
window.tapValue+=p===0?5:-5;
window.tapValue=Math.max(0,Math.min(100,window.tapValue));
$("meterBar").style.width=window.tapValue+"%";
$("tapScore").textContent=Math.round(window.tapValue)+" : "+(100-Math.round(window.tapValue));
if(window.tapValue>=100||window.tapValue<=0){
locked=true;clearInterval(interval);
$("tapStatus").textContent=(window.tapValue>=100?"PLAYER 1":"PLAYER 2")+" WINS! 🏆";
beep(950);
}else beep(400);
}

// TOWER BUILDER
function tower(){
window.towerHeight=0;window.towerMax=10;
$("gameArea").innerHTML='<div class="status" id="towerStatus">Build the tallest tower!</div><div id="towerStack" style="font-size:35px;min-height:220px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start"></div><button class="bigbutton" onclick="addTower()">🏗️ BUILD!</button>';
}
function addTower(){
if(window.towerHeight>=window.towerMax)return;
window.towerHeight++;
$("towerStack").innerHTML+="<div>🧱</div>";
$("towerStatus").textContent="Tower height: "+window.towerHeight;
beep(400+window.towerHeight*30);
if(window.towerHeight===window.towerMax)$("towerStatus").textContent="Amazing! Tower completed! 🏆";
}

// MAZE RACE
function maze(){
window.mazePos=0;
$("gameArea").innerHTML='<div class="status" id="mazeStatus">Reach the finish line!</div><div id="mazeTrack" style="font-size:28px;letter-spacing:7px;margin:30px 0">🏃⬜⬜⬜⬜⬜⬜🏁</div><div class="options"><button onclick="moveMaze(-1)">⬅️</button><button onclick="moveMaze(1)">➡️</button></div>';
}
function moveMaze(d){
window.mazePos=Math.max(0,Math.min(6,window.mazePos+d));
let s="";for(let i=0;i<7;i++)s+=i===window.mazePos?"🏃":"⬜";
$("mazeTrack").textContent=s+"🏁";
if(window.mazePos===6)$("mazeStatus").textContent="FINISH! YOU WON! 🏆";
beep();
}

// MINI RACING
function racing(){
window.carLane=1;window.racePos=0;
$("gameArea").innerHTML='<div class="status" id="raceStatus">Switch lanes and reach 10!</div><div id="raceTrack" style="font-size:35px;line-height:2">⬜ 🏎️ ⬜</div><div class="status" id="racePos">Distance: 0 / 10</div><div class="options"><button onclick="lane(-1)">⬅️ LEFT</button><button onclick="lane(1)">RIGHT ➡️</button></div><button onclick="drive()">🏎️ ACCELERATE</button>';
}
function lane(d){window.carLane=Math.max(0,Math.min(2,window.carLane+d));drawRace()}
function drawRace(){$("raceTrack").textContent=[0,1,2].map(i=>i===window.carLane?"🏎️":"⬜").join("  ")}
function drive(){
if(window.racePos>=10)return;
window.racePos++;
$("racePos").textContent="Distance: "+window.racePos+" / 10";
if(Math.random()<.25){$("raceStatus").textContent="Obstacle! Change lane!";beep(180)}
else $("raceStatus").textContent="Keep going!";
if(window.racePos===10)$("raceStatus").textContent="YOU FINISHED THE RACE! 🏆";
}

// AIR HOCKEY
function hockey(){
window.hockeyScore=[0,0];
$("gameArea").innerHTML='<div class="status" id="hStatus">Tap the puck to score!</div><div style="border:3px solid #80dfff;border-radius:18px;height:230px;background:linear-gradient(#182b50,#26365a);display:grid;place-items:center;margin:20px"><button class="bigbutton" id="puck" onclick="hitPuck()">🏒 🥅</button></div><div class="status" id="hScore">Player 1: 0 | Player 2: 0</div>';
}
function hitPuck(){
let p=mode==="bot"?1:Math.floor(Math.random()*2);
window.hockeyScore[p]++;
$("hScore").textContent=`Player 1: ${window.hockeyScore[0]} | Player 2: ${window.hockeyScore[1]}`;
$("hStatus").textContent="Goal! Player "+(p+1)+" scores!";
beep(800);
}

// CHESS - MINI BOARD
function chess(){
let pieces=["♜","♞","♝","♛","♚","♝","♞","♜","♟","♟","♟","♟","♟","♟","♟","♟"];
let back=["♜","♞","♝","♛","♚","♝","♞","♜"];
window.chessBoard=Array(64).fill("");
for(let i=0;i<8;i++){window.chessBoard[i]=back[i];window.chessBoard[i+8]="♟";window.chessBoard[48+i]="♙";window.chessBoard[56+i]=["♖","♘","♗","♕","♔","♗","♘","♖"][i]}
window.chessPick=-1;
$("gameArea").innerHTML='<div class="status" id="chStatus">Select a piece, then select a square.</div><div class="board" id="chBoard" style="grid-template-columns:repeat(8,38px);gap:2px"></div>';
drawChess();
}
function drawChess(){
$("chBoard").innerHTML=window.chessBoard.map((v,i)=>`<div onclick="chessTap(${i})" style="width:38px;height:38px;background:${(Math.floor(i/8)+i%8)%2?"#786b91":"#e1d6c9"};color:#171327;font-size:25px;display:grid;place-items:center">${v}</div>`).join("");
}
function chessTap(i){
if(window.chessPick<0){if(!window.chessBoard[i])return;window.chessPick=i;$("chStatus").textContent="Now choose a destination square.";return}
window.chessBoard[i]=window.chessBoard[window.chessPick];window.chessBoard[window.chessPick]="";window.chessPick=-1;drawChess();$("chStatus").textContent="Piece moved!";
}

// CHECKERS - BASIC BOARD
function checkers(){
window.checkBoard=Array(64).fill("");
for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2)window.checkBoard[r*8+c]="🔴";
for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2)window.checkBoard[r*8+c]="⚫";
window.checkPick=-1;
$("gameArea").innerHTML='<div class="status" id="checkStatus">Select a checker and move it diagonally.</div><div class="board" id="checkBoardUI" style="grid-template-columns:repeat(8,36px);gap:2px"></div>';
drawCheck();
}
function drawCheck(){
$("checkBoardUI").innerHTML=window.checkBoard.map((v,i)=>`<div onclick="checkTap(${i})" style="width:36px;height:36px;background:${(Math.floor(i/8)+i%8)%2?"#705a42":"#e4d1ad"};display:grid;place-items:center;font-size:23px">${v}</div>`).join("");
}
function checkTap(i){
if(window.checkPick<0){if(!window.checkBoard[i])return;window.checkPick=i;$("checkStatus").textContent="Choose a square.";return}
let a=window.checkPick;
if(!window.checkBoard[i]&&Math.abs(i%8-a%8)===1&&Math.abs(Math.floor(i/8)-Math.floor(a/8))===1){
window.checkBoard[i]=window.checkBoard[a];window.checkBoard[a]="";$("checkStatus").textContent="Moved!";
}else $("checkStatus").textContent="Try a diagonal square.";
window.checkPick=-1;drawCheck();
}
</script>
</body>
</html>
